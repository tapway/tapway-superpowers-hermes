name: Mirror integrity

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify mirror equals tapway/tapway-superpowers hermes/plugin
        run: python3 scripts/verify_mirror.py